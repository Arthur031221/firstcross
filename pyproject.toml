[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "firstcross"
version = "1.0.0"
description = "Solids from single-photon histograms by first-crossing likelihoods"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "pillow>=9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
packages = ["firstcross"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
