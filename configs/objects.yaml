# Captured objects of the Transientangelo release (object table and photon-count curve).
kind: objects
settings:
  grid_size: 256
  half_size: 0.32
  ball: true
  omega: 3.7
  q: 0.1
  eps: 0.012
  margin: 0.006
  sig_s: 1.0e-4
  neff: 20.0
  tau_sigma: 2.646
  rounds: 12
  march_step: 0.001
  seed: 0
data:
  root: data/transientangelo
  full_flux: "{root}/{scene}/transient{view:03d}.pt"
  low_flux: "{root}/{scene}/{level}/transient_{view:02d}.pt"
  masks: "{root}/masks/{scene}/train_{view:03d}_mask.png"
  cameras: "{root}/{scene}/final_cams"
  intrinsics: "{root}/intrinsics_safe.npz"
  pulse: "{root}/pulse_low_flux.mat"
  reference_cache: "{root}/references/{scene}.npz"
# bin0: first 8 ps bin of the crop (5th percentile of the first returns minus 40 bins),
# n_bins: coarse bins of 16 ps.
scenes:
  baskets: {bin0: 793, n_bins: 256}
  boots: {bin0: 816, n_bins: 256}
  chef: {bin0: 795, n_bins: 256}
  food: {bin0: 818, n_bins: 256}
  cinema: {bin0: 835, n_bins: 256}
  carving: {bin0: 806, n_bins: 256}
